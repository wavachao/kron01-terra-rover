name: CAD & DFM Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DFM Mesh, Electrical & Packaging Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cad/requirements.txt

      - name: Install DFM audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "trimesh>=4.0.0" "numpy>=1.26.0" "scipy>=1.12.0"

      - name: Verify Python syntax
        run: python -m py_compile cad/*.py scripts/*.py

      - name: Run electrical netlist, power & kinematics simulation
        run: python cad/simulate_system.py

      - name: Run DFM watertight & single-body STL audit (38 STLs)
        run: python cad/dfm_audit.py

      - name: Dry-run manufacturing release packaging & checksum verification
        run: |
          python scripts/package_release.py \
            --version "ci-${GITHUB_SHA::7}" \
            --output dist \
            --release-notes dist/release-notes.md
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload manufacturing preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kron01-manufacturing-preview
          path: |
            dist/jlc3dp_ready_16_stl.zip
            dist/KRON01_Printed_Assembly.3mf
            dist/SHA256SUMS.txt
          retention-days: 7
