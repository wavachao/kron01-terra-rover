name: Release Manufacturing Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create & publish (e.g. v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Verify, Package & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version tag '${TAG}'. Expected format like v1.0.0"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DFM audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "trimesh>=4.0.0" "numpy>=1.26.0" "scipy>=1.12.0"

      - name: Release Gate — Electrical & kinematics audit
        run: python cad/simulate_system.py

      - name: Release Gate — DFM watertight & single-body STL audit
        run: python cad/dfm_audit.py

      - name: Build verified manufacturing release archives
        run: |
          python scripts/package_release.py \
            --version "${{ steps.meta.outputs.tag }}" \
            --output release-assets \
            --release-notes release-notes.md
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "KRON-01V6 Terra-Rover ${{ steps.meta.outputs.tag }}"
          body_path: release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/jlc3dp_ready_14_stl.zip
            release-assets/kron01-terra-rover-${{ steps.meta.outputs.tag }}-fdm-plates-stl.zip
            release-assets/KRON01_Printed_Assembly.3mf
            release-assets/kron01-terra-rover-${{ steps.meta.outputs.tag }}-cad-step.zip
            release-assets/kron01-terra-rover-${{ steps.meta.outputs.tag }}-simulator.zip
            release-assets/SHA256SUMS.txt
